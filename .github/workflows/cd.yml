name: CD Pipeline

on:
    push:
        branches: [dev]
jobs:
    deploy_to_ecs:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        
        env:
            AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
            AWS_REGION: ${{ secrets.AWS_REGION }}
            ECR_REPOSITORY: chatbot
            IMAGE_TAG: latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Cache Docker layers
              uses: actions/cache@v4
              with:
                path: /tmp/.buildx-cache
                key: ${{ runner.os }}-buildx-${{ github.sha }}
                restore-keys: |
                    ${{ runner.os }}-buildx-

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{secrets.PUSH_AWS_ROLE_TO_ASSUME}}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2
            
            - name: Set ECR variables to pull the base image
              run: echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
                   echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
                   echo "ECR_REPOSITORY=chatbot" >> $GITHUB_ENV
                   echo "IMAGE_TAG=latest" >> $GITHUB_ENV

            - name: Build the production image
              run: make build

            - name: Push the production image
              run : |
                 docker tag docker-api:latest ${secrets.PUSH_IMAGE_URI}
                 docker push ${secrets.PUSH_IMAGE_URI}
            

            - name: Restart ECS service
              run: |
                aws ecs update-service \
                    --cluster chatbot-ecs-cluster\
                    --service chatbot-ecs-cluster-service \
                    --force-new-deployment    


                