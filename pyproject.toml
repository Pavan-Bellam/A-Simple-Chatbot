[project]
name = "a-simple-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "black>=25.9.0",
    "boto3>=1.40.29",
    "fastapi[standard]>=0.116.1",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "isort>=6.1.0",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.33",
    "pgvector>=0.4.1",
    "psycopg2>=2.9.10",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.10.1",
    "pytest>=8.4.2",
    "sentence-transformers>=5.1.0",
    "sqlalchemy>=2.0.43",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/alembic/versions/*"]
known_first_party = ["app", "tests"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.flake8]
# Note: flake8 doesn't officially support pyproject.toml
# Use .flake8 or setup.cfg instead, or use flake8-pyproject plugin
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "alembic/versions",
]
max-complexity = 10
per-file-ignores = [
    "__init__.py:F401",
]
